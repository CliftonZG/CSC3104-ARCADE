name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true

      - name: Verify Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files require gofmt formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test-and-race:
    name: Tests & Race Detector
    runs-on: ubuntu-latest
    needs: [ lint ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage.txt

  fuzz:
    name: Continuous Fuzz Testing
    runs-on: ubuntu-latest
    needs: [ lint ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Fuzz Binary Snapshot Decoder (30s)
        run: go test -fuzz=FuzzRestoreFromBinary -fuzztime=30s ./pkg/uno

      - name: Fuzz JSON Snapshot Decoder (30s)
        run: go test -fuzz=FuzzRestoreFromSnapshot -fuzztime=30s ./pkg/uno

  benchmark:
    name: Performance Regression Benchmarks
    runs-on: ubuntu-latest
    needs: [ test-and-race ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Benchmarks
        run: go test -bench=. -benchmem ./... | tee bench-results.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results.txt

  build-binaries:
    name: Cross-Platform Binary Compilation
    runs-on: ubuntu-latest
    needs: [ test-and-race ]
    strategy:
      matrix:
        targetos: [ linux, darwin ]
        targetarch: [ amd64, arm64 ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Compile Gameserver (${{ matrix.targetos }}/${{ matrix.targetarch }})
        env:
          GOOS: ${{ matrix.targetos }}
          GOARCH: ${{ matrix.targetarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -trimpath -o bin/gameserver-${{ matrix.targetos }}-${{ matrix.targetarch }} ./cmd/gameserver
          go build -ldflags="-s -w" -trimpath -o bin/proxy-${{ matrix.targetos }}-${{ matrix.targetarch }} ./cmd/proxy
          go build -ldflags="-s -w" -trimpath -o bin/chaos-${{ matrix.targetos }}-${{ matrix.targetarch }} ./cmd/chaos

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.targetos }}-${{ matrix.targetarch }}
          path: bin/
