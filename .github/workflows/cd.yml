name: CD Pipeline (Containers & Deployments)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'deployments/**'
      - 'k8s/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    name: Build & Push Distroless Container Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Gameserver
        id: meta-gameserver
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/gameserver
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build & Push Gameserver Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile.gameserver
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-gameserver.outputs.tags }}
          labels: ${{ steps.meta-gameserver.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata for Proxy
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/proxy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build & Push Proxy Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile.proxy
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
