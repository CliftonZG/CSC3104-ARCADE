# In-cluster load probe (cmd/loadprobe). test/load/run-load.ps1 fills in the
# __PLACEHOLDERS__ and creates one Job per measurement step. Manual use:
#   (edit the placeholders) kubectl -n arcade apply -f k8s/load/loadprobe-job.yaml
#   kubectl -n arcade logs -f job/arcade-loadprobe-__PAIRS__
apiVersion: batch/v1
kind: Job
metadata:
  name: arcade-loadprobe-__PAIRS__
  namespace: arcade
  labels:
    app.kubernetes.io/name: arcade-loadprobe
    app.kubernetes.io/part-of: arcade
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arcade-loadprobe
        app.kubernetes.io/part-of: arcade
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadprobe
          image: arcade/loadprobe:dev
          imagePullPolicy: IfNotPresent
          args:
            - -pairs=__PAIRS__
            - -window=__WINDOW__
            - -redis=arcade-redis:6379
            - -label=pairs=__PAIRS__
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
