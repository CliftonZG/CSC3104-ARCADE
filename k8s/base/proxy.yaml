# Client-facing WebSocket ingress proxy (cmd/proxy, owner: Brian).
# Clients keep one WebSocket to the proxy; the proxy forwards each match to
# the pod that is currently primary and retargets on takeover. It finds the
# primary via the arcade.io/role pod label or GET /role on the pair's stable
# DNS names (arcade-gs-a-<i> / arcade-gs-b-<i> . arcade-gs), see k8s/README.md.
apiVersion: v1
kind: Service
metadata:
  name: arcade-proxy
  labels:
    app.kubernetes.io/name: arcade-proxy
spec:
  # Docker Desktop exposes LoadBalancer services on localhost:8080.
  # On kind it stays <pending>; use the fixed NodePort (mapped to host 8080 by
  # k8s/kind-cluster.yaml) or `kubectl port-forward svc/arcade-proxy 8080`.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: arcade-proxy
  ports:
    - name: ws
      port: 8080
      targetPort: ws
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcade-proxy
  labels:
    app.kubernetes.io/name: arcade-proxy
    app.kubernetes.io/component: ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arcade-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arcade-proxy
        app.kubernetes.io/component: ingress
    spec:
      serviceAccountName: arcade-proxy
      terminationGracePeriodSeconds: 15
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: arcade/proxy:dev
          imagePullPolicy: IfNotPresent
          args: ["-port=8080"]
          env:
            # Fleet discovery hints for the proxy (same layout as pkg/fleet).
            - name: GAMESERVER_SERVICE
              value: arcade-gs
            - name: GAMESERVER_SETS
              value: arcade-gs-a,arcade-gs-b
            - name: GAMESERVER_HTTP_PORT
              value: "8081"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: ws
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: ws
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: ws
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
