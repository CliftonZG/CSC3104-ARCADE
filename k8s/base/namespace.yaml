apiVersion: v1
kind: Namespace
metadata:
  name: arcade
  labels:
    app.kubernetes.io/part-of: arcade
    # Our own images (gameserver, proxy, loadprobe) satisfy the strict
    # "restricted" Pod Security Standard: distroless, non-root, no privilege
    # escalation, all capabilities dropped. The stock Redis image needs root
    # briefly (its entrypoint chowns /data, then drops to the redis user), so
    # the namespace enforces "baseline" and only warns on "restricted".
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
