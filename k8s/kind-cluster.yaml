# Multi-node kind cluster for the 50 / 100 pair load tests.
#
# Why: a single-node cluster (e.g. Docker Desktop's default) allows at most
# 110 pods per node, and 100 pairs alone are 200 pods. Here each worker
# allows 250 pods, and with two workers the anti-affinity rule in
# k8s/base/gameserver-*.yaml can put the primary and standby of a pair on
# different nodes.
#
#   kind create cluster --config k8s/kind-cluster.yaml
#   kind load docker-image arcade/gameserver:dev arcade/proxy:dev arcade/loadprobe:dev --name arcade
#   kubectl apply -k k8s/overlays/load
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: arcade
nodes:
  - role: control-plane
    extraPortMappings:
      # arcade-proxy NodePort -> http://localhost:8080 on the host
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        maxPods: 250
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        maxPods: 250
