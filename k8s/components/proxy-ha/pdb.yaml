# Voluntary disruptions (node drain, cluster upgrade) may take down at most one
# proxy at a time; the other one keeps serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: arcade-proxy
  labels:
    app.kubernetes.io/name: arcade-proxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arcade-proxy
